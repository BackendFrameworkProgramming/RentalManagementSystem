<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('사용자 관리')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="page-wrapper">
    <div class="main-content">
        <div class="toolbar">
            <div class="toolbar-left"><div class="breadcrumb">사용자 관리</div></div>
            <div class="toolbar-right">
                <button class="btn btn-new" onclick="openCreate()">+ 사용자 등록</button>
            </div>
        </div>
        <div class="search-bar">
            <select id="sf"><option value="userName">사용자명</option><option value="userLoginId">로그인ID</option></select>
            <input type="text" id="sk" placeholder="검색어 입력" onkeydown="if(event.key==='Enter')loadUsers(1)">
            <button class="search-btn" onclick="loadUsers(1)">검색</button>
            <span class="total-info">총 <b id="totalEl">0</b>건</span>
        </div>
        <div class="table-wrap">
            <table class="grid">
                <thead><tr><th>No</th><th>사용자명</th><th>로그인ID</th><th>역할</th><th>연락처</th><th>이메일</th><th>관리</th></tr></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
        <div class="pagination-bar" id="paging"></div>
    </div>
</div>
<!-- 사용자 등록/수정 Draw -->
<div class="draw-overlay" id="userDrawOverlay" onclick="closeDraw('userDraw')"></div>
<div class="draw" id="userDraw">
    <div class="draw-header"><span id="userDrawTitle">사용자 등록</span><button class="draw-close" onclick="closeDraw('userDraw')">&times;</button></div>
    <div class="draw-body">
        <div class="form-section">
            <div class="form-group"><label>사용자명 *</label><input id="uName"></div>
            <div class="form-group"><label>로그인ID *</label><input id="uLoginId"></div>
            <div class="form-group"><label id="uPwLabel">비밀번호 *</label><input type="password" id="uPassword" placeholder="비밀번호 입력"></div>
            <div class="form-row">
                <div class="form-group"><label>역할 *</label>
                    <select id="uRole" onchange="toggleBranchField()" style="width:100%;padding:7px 10px;border:1px solid #cbd5e0;border-radius:3px;font-size:12px">
                        <option value="STAFF">운영자</option>
                        <option value="BRANCH_MANAGER">지점관리자</option>
                        <option value="ADMIN">관리자</option>
                    </select>
                </div>
            </div>
            <div class="form-row" id="uBranchRow" style="display:none">
                <div class="form-group"><label>담당 지점 *</label>
                    <select id="uBranch" style="width:100%;padding:7px 10px;border:1px solid #cbd5e0;border-radius:3px;font-size:12px">
                        <option value="">지점 선택</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>연락처</label><input id="uContact" placeholder="010-0000-0000"></div>
                <div class="form-group"><label>이메일</label><input id="uEmail" type="email" placeholder="email@example.com"></div>
            </div>
        </div>
        <button class="btn btn-save" id="uSaveBtn" onclick="saveUser()">등록</button>
    </div>
</div>
<script th:src="@{/js/common.js}"></script>
<script>
let editId = null; // null=등록, 값=수정 대상 id
let branchesLoaded = false;

// 지점관리자 역할일 때 쓸 지점 목록을 1회만 로드
async function loadBranches(){
    if(branchesLoaded)return;
    const r=await api('/api/branches?page=1&size=500');
    const opts=(r.data||[]).map(b=>`<option value="${b.id}">${b.branchName}</option>`).join('');
    document.getElementById('uBranch').innerHTML='<option value="">지점 선택</option>'+opts;
    branchesLoaded=true;
}
// 역할이 지점관리자일 때만 지점 선택칸 노출
function toggleBranchField(){
    document.getElementById('uBranchRow').style.display=(document.getElementById('uRole').value==='BRANCH_MANAGER')?'':'none';
}

async function loadUsers(p=1){
    const sf=document.getElementById('sf').value,sk=document.getElementById('sk').value;
    let url=`/api/users?page=${p}&size=20`;
    if(sk)url+=`&searchField=${sf}&searchKeyword=${sk}`;
    const r=await api(url);let i=(p-1)*20;
    document.getElementById('totalEl').textContent=r.pagination?.totalElements||0;
    document.getElementById('tbody').innerHTML=(r.data||[]).map(u=>{
        const roleMap={ADMIN:['관리자','badge-AS접수'],BRANCH_MANAGER:['지점관리자','badge-임대중'],STAFF:['운영자','badge-임대대기']};
        const [roleLabel,badgeClass]=roleMap[u.role]||roleMap.STAFF;
        const u2=JSON.stringify(u).replace(/"/g,'&quot;');
        return `<tr>
        <td class="center">${++i}</td>
        <td>${u.userName}</td><td>${u.userLoginId||'-'}</td>
        <td class="center"><span class="badge ${badgeClass}">${roleLabel}</span></td>
        <td>${u.contact||'-'}</td><td>${u.email||'-'}</td>
        <td class="center">
            <button class="btn btn-sm" onclick="openEdit(${u2})">수정</button>
            <button class="btn btn-sm btn-delete" onclick="deleteUser(${u.id})">삭제</button>
        </td>
    </tr>`;}).join('')||'<tr><td colspan="7" style="text-align:center;padding:30px;color:#aaa">사용자 없음</td></tr>';
    paginate(document.getElementById('paging'),r.pagination,'loadUsers');
}

async function openCreate(){
    editId=null;
    document.getElementById('userDrawTitle').textContent='사용자 등록';
    document.getElementById('uPwLabel').textContent='비밀번호 *';
    document.getElementById('uPassword').placeholder='비밀번호 입력';
    document.getElementById('uSaveBtn').textContent='등록';
    document.getElementById('uLoginId').disabled=false;
    ['uName','uLoginId','uPassword','uContact','uEmail'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('uRole').value='STAFF';
    await loadBranches();
    document.getElementById('uBranch').value='';
    toggleBranchField();
    openDraw('userDraw');
}

async function openEdit(u){
    editId=u.id;
    document.getElementById('userDrawTitle').textContent='사용자 수정';
    document.getElementById('uPwLabel').textContent='비밀번호 (변경 시에만 입력)';
    document.getElementById('uPassword').placeholder='비워두면 기존 비밀번호 유지';
    document.getElementById('uSaveBtn').textContent='저장';
    document.getElementById('uName').value=u.userName||'';
    document.getElementById('uLoginId').value=u.userLoginId||'';
    document.getElementById('uLoginId').disabled=true; // 로그인ID는 수정 불가
    document.getElementById('uPassword').value='';
    document.getElementById('uRole').value=['ADMIN','BRANCH_MANAGER','STAFF'].includes(u.role)?u.role:'STAFF';
    document.getElementById('uContact').value=u.contact||'';
    document.getElementById('uEmail').value=u.email||'';
    await loadBranches();
    document.getElementById('uBranch').value=u.branchId||'';
    toggleBranchField();
    openDraw('userDraw');
}

async function saveUser(){
    const userName=document.getElementById('uName').value;
    const password=document.getElementById('uPassword').value;
    const role=document.getElementById('uRole').value;
    const contact=document.getElementById('uContact').value;
    const email=document.getElementById('uEmail').value;

    // 지점관리자는 담당 지점 필수, 그 외 역할은 지점 연결 해제(null)
    let branchId=null;
    if(role==='BRANCH_MANAGER'){
        branchId=document.getElementById('uBranch').value;
        if(!branchId){toast('지점관리자는 담당 지점을 선택해야 합니다.','error');return;}
        branchId=Number(branchId);
    }

    if(editId===null){
        // 등록
        const loginId=document.getElementById('uLoginId').value;
        if(!userName||!loginId||!password){toast('사용자명, 로그인ID, 비밀번호는 필수입니다.','error');return;}
        const body={userName,userLoginId:loginId,password,role,contact,email,branchId};
        const r=await api('/api/users','POST',body);
        if(r.success){toast('사용자 등록 완료');closeDraw('userDraw');loadUsers();}else toast(r.error?.message,'error');
    }else{
        // 수정 (비번은 입력했을 때만 전송)
        if(!userName){toast('사용자명은 필수입니다.','error');return;}
        const body={userName,role,contact,email,branchId};
        if(password)body.password=password;
        const r=await api(`/api/users/${editId}`,'PATCH',body);
        if(r.success){toast('수정 완료');closeDraw('userDraw');loadUsers();}else toast(r.error?.message,'error');
    }
}

async function deleteUser(id){if(!confirm('이 사용자를 삭제하시겠습니까?'))return;const r=await api(`/api/users/${id}`,'DELETE');if(r.success){toast('삭제 완료');loadUsers();}else toast(r.error?.message,'error');}
loadUsers();
</script>
</body></html>
