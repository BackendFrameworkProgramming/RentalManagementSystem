<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('센터정보')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div style="max-width:1200px;margin:0 auto;padding:20px">
    <!-- 센터정보 -->
    <div class="form-section">
        <div class="form-section-title">센터정보</div>
        <div class="form-row">
            <div class="form-group"><label>센터명</label><input id="centerName" placeholder="센터명을(를) 입력해 주세요"></div>
            <div class="form-group"><label>사업자등록번호</label><input id="bizRegNo"></div>
            <div class="form-group"><label>센터장</label><input id="ceoName"></div>
            <div class="form-group"><label>주소</label><input id="address"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>센터명약칭</label><input id="centerNameAbbr"></div>
            <div class="form-group"><label>법인등록번호</label><input id="corpRegNo"></div>
            <div class="form-group"><label>대표전화번호</label><input id="phone"></div>
            <div class="form-group"><label>우편번호</label><input id="zipCode"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>영문센터명</label><input id="centerNameEn"></div>
            <div class="form-group"><label>업태</label><input id="bizType"></div>
            <div class="form-group"><label>대표팩스번호</label><input id="fax"></div>
            <div class="form-group"><label></label><input id="addressDetail" placeholder="상세주소"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>영문센터명약칭</label><input id="centerNameEnAbbr"></div>
            <div class="form-group"><label>업종</label><input id="bizCategory"></div>
            <div class="form-group"><label>대표이메일</label><input id="email"></div>
            <div class="form-group"></div>
        </div>
    </div>

    <!-- 세금계산서 담당자 -->
    <div class="form-section">
        <div class="form-section-title">세금계산서 담당자</div>
        <div class="form-row">
            <div class="form-group"><label>담당자명</label><input id="taxManagerName"></div>
            <div class="form-group"><label>이메일</label><input id="taxManagerEmail"></div>
            <div class="form-group"><label>전화번호</label><input id="taxManagerPhone"></div>
            <div class="form-group"><label>팩스번호</label><input id="taxManagerFax"></div>
        </div>
    </div>

    <!-- 센터 직인 및 로고 -->
    <div class="form-section">
        <div class="form-section-title">센터 직인 및 로고</div>
        <div class="form-row">
            <div class="form-group" style="text-align:center;border:2px dashed #cbd5e0;padding:30px;border-radius:4px">
                <div style="color:#a0aec0;font-size:12px">센터직인</div>
                <div style="font-size:28px;color:#cbd5e0;margin:8px 0">+</div>
                <div style="color:#a0aec0;font-size:11px">이미지 파일을 업로드 해주세요</div>
            </div>
            <div class="form-group" style="text-align:center;border:2px dashed #cbd5e0;padding:30px;border-radius:4px">
                <div style="color:#a0aec0;font-size:12px">센터로고(밝은모드)</div>
                <div style="font-size:28px;color:#cbd5e0;margin:8px 0">+</div>
                <div style="color:#a0aec0;font-size:11px">이미지 파일을 업로드 해주세요</div>
            </div>
            <div class="form-group" style="text-align:center;border:2px dashed #cbd5e0;padding:30px;border-radius:4px">
                <div style="color:#a0aec0;font-size:12px">센터로고(어두운모드)</div>
                <div style="font-size:28px;color:#cbd5e0;margin:8px 0">+</div>
                <div style="color:#a0aec0;font-size:11px">이미지 파일을 업로드 해주세요</div>
            </div>
        </div>
    </div>

    <div style="text-align:center;margin-top:16px"><button class="btn btn-save" onclick="saveCenter()" style="padding:10px 40px;font-size:14px">저장</button></div>
</div>
<script th:src="@{/js/common.js}"></script>
<script>
const F=['centerName','centerNameAbbr','centerNameEn','centerNameEnAbbr','bizRegNo','corpRegNo','bizType','bizCategory','ceoName','phone','fax','email','zipCode','address','addressDetail','taxManagerName','taxManagerEmail','taxManagerPhone','taxManagerFax'];
async function load(){const r=await api('/api/center');if(r.data)F.forEach(f=>{const el=document.getElementById(f);if(el&&r.data[f])el.value=r.data[f]})}
async function saveCenter(){const b={};F.forEach(f=>{const el=document.getElementById(f);if(el)b[f]=el.value});const r=await api('/api/center','PUT',b);if(r.success)toast('저장 완료');else toast(r.error?.message||'실패','error')}
load();
</script>
</body></html>
