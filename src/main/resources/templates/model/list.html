<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('모델 관리')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div class="container">
<div class="card">
    <div class="card-header"><h2>모델 관리</h2><button class="btn btn-primary" onclick="openModal('modelModal')">+ 모델 등록</button></div>
    <table class="data-table">
        <thead><tr><th>ID</th><th>모델명</th><th>제조사</th><th>버전 수</th><th>관리</th></tr></thead>
        <tbody id="modelTable"></tbody>
    </table>
</div>
<div class="card" id="versionCard" style="display:none;">
    <div class="card-header"><h2 id="versionTitle">버전 목록</h2><button class="btn btn-primary" onclick="openModal('versionModal')">+ 버전 등록</button></div>
    <table class="data-table">
        <thead><tr><th>버전</th><th>스펙</th><th>출시일</th><th>매뉴얼</th><th>관리</th></tr></thead>
        <tbody id="versionTable"></tbody>
    </table>
</div>
</div>
<div class="modal-overlay" id="modelModal"><div class="modal">
    <div class="modal-header"><h3>모델 등록</h3><button class="modal-close" onclick="closeModal('modelModal')">×</button></div>
    <div class="form-group"><label>모델명</label><input id="mName"></div>
    <div class="form-group"><label>제조사</label><input id="mManu"></div>
    <div class="form-group"><label>설명</label><textarea id="mDesc" rows="3"></textarea></div>
    <button class="btn btn-primary" onclick="createModel()">등록</button>
</div></div>
<div class="modal-overlay" id="versionModal"><div class="modal">
    <div class="modal-header"><h3>버전 등록</h3><button class="modal-close" onclick="closeModal('versionModal')">×</button></div>
    <div class="form-group"><label>버전</label><input id="vVer"></div>
    <div class="form-group"><label>스펙</label><textarea id="vSpec" rows="3"></textarea></div>
    <div class="form-group"><label>출시일</label><input type="date" id="vDate"></div>
    <button class="btn btn-primary" onclick="createVersion()">등록</button>
</div></div>
<script th:src="@{/js/common.js}"></script>
<script>
let selectedModelId = null;
async function loadModels() {
    const res = await api('/api/models');
    document.getElementById('modelTable').innerHTML = (res.data||[]).map(m => `<tr>
        <td>${m.id}</td><td><a href="#" onclick="selectModel(${m.id},'${m.modelName}')">${m.modelName}</a></td>
        <td>${m.manufacturer||'-'}</td><td>${(m.versions||[]).length}</td>
        <td><button class="btn btn-sm btn-danger" onclick="deleteModel(${m.id})">삭제</button></td>
    </tr>`).join('') || '<tr><td colspan="5" style="text-align:center;padding:30px;">데이터 없음</td></tr>';
}
function selectModel(id, name) {
    selectedModelId = id;
    document.getElementById('versionTitle').textContent = name + ' - 버전 목록';
    document.getElementById('versionCard').style.display = 'block';
    loadVersions(id);
}
async function loadVersions(id) {
    const res = await api(`/api/models/${id}`);
    document.getElementById('versionTable').innerHTML = (res.data?.versions||[]).map(v => `<tr>
        <td>${v.version}</td><td>${v.spec||'-'}</td><td>${v.releaseDate||'-'}</td>
        <td>${v.manualFileName ? `<a href="/api/model-versions/${v.id}/manual">${v.manualFileName}</a>` : '-'}</td>
        <td><button class="btn btn-sm btn-danger" onclick="deleteVersion(${v.id})">삭제</button></td>
    </tr>`).join('') || '<tr><td colspan="5" style="text-align:center;">버전 없음</td></tr>';
}
async function createModel() { const res = await api('/api/models','POST',{modelName:document.getElementById('mName').value,manufacturer:document.getElementById('mManu').value,description:document.getElementById('mDesc').value}); if(res.success){toast('등록 완료');closeModal('modelModal');loadModels();}else{toast(res.error?.message,'error');} }
async function deleteModel(id) { if(!confirm('삭제?'))return; const res = await api(`/api/models/${id}`,'DELETE'); if(res.success){toast('삭제');loadModels();document.getElementById('versionCard').style.display='none';}else{toast(res.error?.message,'error');} }
async function createVersion() { const res = await api(`/api/models/${selectedModelId}/versions`,'POST',{version:document.getElementById('vVer').value,spec:document.getElementById('vSpec').value,releaseDate:document.getElementById('vDate').value||null}); if(res.success){toast('등록 완료');closeModal('versionModal');loadVersions(selectedModelId);}else{toast(res.error?.message,'error');} }
async function deleteVersion(id) { if(!confirm('삭제?'))return; const res = await api(`/api/model-versions/${id}`,'DELETE'); if(res.success){toast('삭제');loadVersions(selectedModelId);}else{toast(res.error?.message,'error');} }
loadModels();
</script>
</body></html>
