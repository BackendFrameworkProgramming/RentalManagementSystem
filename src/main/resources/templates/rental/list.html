<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('디바이스 임대 현황')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="page-wrapper">
    <div class="left-panel">
        <div class="left-panel-header">지점</div>
        <div class="left-panel-search">
            <input type="text" id="branchSearch" placeholder="검색" oninput="filterBranch()">
        </div>
        <div class="left-panel-list" id="branchList">
            <div class="left-panel-item active" onclick="selectBranch(null,'전체')">
                <span>전체</span>
                <span class="count"><span id="totalAllCount">-</span> / <span id="totalRentingCount" style="color:blue">-</span></span>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="toolbar">
            <div class="toolbar-left">
                <div class="breadcrumb">
                    <span class="refresh" onclick="selectBranch(null,'전체')">⟳</span>
                    <span id="breadcrumb">전체 > 디바이스 임대 현황</span>
                </div>
            </div>
            <div class="toolbar-right">
                <button class="btn btn-delete" onclick="deleteSelected()">삭제</button>
                <button class="btn btn-save" onclick="saveAll()">저장</button>
            </div>
        </div>

        <div class="search-bar">
            <select id="sf">
                <option value="all">통합검색</option>
                <option value="branchName">지점명</option>
                <option value="deviceId">디바이스ID</option>
                <option value="modelName">모델명</option>
                <option value="userName">신청자명</option>
                <option value="userId">신청자ID</option>
            </select>
            <input type="text" id="sk" placeholder="검색어 입력 후 엔터" onkeydown="if(event.key==='Enter')loadRentals(1)">
            <button class="search-btn" onclick="loadRentals(1)">🔍</button>

            <select id="orderField">
                <option value="applyDate">신청일</option>
                <option value="returnDate">반납일</option>
            </select>
            <select id="orderType">
                <option value="DESC">내림차순</option>
                <option value="ASC">오름차순</option>
            </select>

            <span class="total-info">총 <b id="totalEl">0</b>건</span>

            <select id="pageSize" onchange="loadRentals(1)" style="padding:4px 6px;font-size:12px;">
                <option value="10">10건씩 보기</option>
                <option value="20" selected>20건씩 보기</option>
                <option value="50">50건씩 보기</option>
            </select>
        </div>

        <div class="table-wrap" style="overflow-x: auto;">
            <table class="grid" style="min-width: 1400px;">
                <thead><tr>
                    <th style="width:30px"><input type="checkbox" id="ckAll" onchange="toggleAll()"></th>
                    <th>순번</th><th>상태</th><th>지점</th><th>신청자</th><th>신청자ID</th>
                    <th>신청일</th><th>사용예정시작일</th><th>반납예정일</th><th>수령일</th>
                    <th>착용여부</th><th>디바이스ID</th><th>모델명</th><th>배터리</th><th>반납일</th>
                </tr></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
        <div class="pagination-bar" id="paging"></div>
    </div>
</div>

<div class="draw-overlay" id="historyDrawOverlay" onclick="closeDraw('historyDraw')"></div>
<div class="draw" id="historyDraw">
    <div class="draw-header">
        <span id="historyDrawTitle">임대 이력</span>
        <button class="draw-close" onclick="closeDraw('historyDraw')">×</button>
    </div>
    <div class="draw-body">
        <table class="grid">
            <thead><tr>
                <th>순번</th><th>상태</th><th>지점</th><th>사용예정시작일</th><th>반납예정일</th>
                <th>수령일</th><th>착용여부</th><th>디바이스ID</th><th>모델명</th><th>반납일</th>
            </tr></thead>
            <tbody id="historyBody"></tbody>
        </table>
    </div>
</div>

<script th:src="@{/js/common.js}"></script>
<script>
    let curPage = 1, curBranch = null, curSize = 20, branches = [];

    function escapeHtml(unsafe) {
        if (unsafe == null || unsafe === '') return '-';
        return String(unsafe).replace(/[&<>"']/g, function(m) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
        });
    }

    function formatStatus(status) {
        const map = {
            'APPLIED': '신청', 'RECEIPT_WAITING': '수령대기', 'RENTING': '사용중',
            'AS_RECEIVED': '이상접수', 'REPLACED': '교체사용', 'RETURNED': '반납'
        };
        const text = map[status] || status;
        if (text === '사용중') return `<span style="color:blue; font-weight:bold">${escapeHtml(text)}</span>`;
        if (text === '반납') return `<span style="color:gray">${escapeHtml(text)}</span>`;
        if (text === '이상접수') return `<span style="color:red">${escapeHtml(text)}</span>`;
        return `<span>${escapeHtml(text)}</span>`;
    }

    async function loadBranches() {
        const res = await api('/api/rentals/summary/by-branch');
        branches = res.data || [];

        let totalAll = 0;
        let totalRenting = 0;

        let html = '';
        branches.forEach(b => {
            totalAll += b.totalCount;
            totalRenting += b.rentingCount;
            html += `<div class="left-panel-item" onclick="selectBranch(${b.branchId}, this.getAttribute('data-name'))" data-name="${escapeHtml(b.branchName)}">
                        <span>${escapeHtml(b.branchName)}</span>
                        <span class="count">${b.totalCount} / <span style="color:blue">${b.rentingCount}</span></span>
                     </div>`;
        });

        document.getElementById('totalAllCount').textContent = totalAll;
        document.getElementById('totalRentingCount').textContent = totalRenting;

        let allHtml = `<div class="left-panel-item active" onclick="selectBranch(null,'전체')">
                          <span>전체</span>
                          <span class="count">${totalAll} / <span style="color:blue">${totalRenting}</span></span>
                       </div>`;
        document.getElementById('branchList').innerHTML = allHtml + html;
    }

    function selectBranch(id, name) {
        curBranch = id;
        document.getElementById('breadcrumb').textContent = (name || '전체') + ' > 디바이스 임대 현황';
        document.querySelectorAll('.left-panel-item').forEach(el => el.classList.remove('active'));
        event?.target?.closest('.left-panel-item')?.classList.add('active');
        loadRentals(1);
    }

    function filterBranch() {
        const v = document.getElementById('branchSearch').value.toLowerCase();
        document.querySelectorAll('.left-panel-item').forEach(el => {
            el.style.display = el.textContent.toLowerCase().includes(v) ? '' : 'none';
        });
    }

    async function loadRentals(page) {
        curPage = page || 1;
        curSize = Number(document.getElementById('pageSize').value);

        // 검색어 중복 세팅 제거 (안전한 파라미터 구성)
        const p = new URLSearchParams({
            searchField: document.getElementById('sf').value,
            searchKeyword: document.getElementById('sk').value,
            orderField: document.getElementById('orderField').value,
            orderType: document.getElementById('orderType').value,
            page: curPage,
            size: curSize
        });

        const res = await api('/api/rentals?' + p);

        const rows = (res.data || []).filter(d => {
            if (curBranch === null) return true;
            return d.branchId === curBranch;
        });

        document.getElementById('totalEl').textContent = res.pagination?.totalElements || 0;
        const tbody = document.getElementById('tbody');

        if (!rows.length) {
            tbody.innerHTML = '<tr><td colspan="15" style="text-align:center;padding:30px;color:#aaa">데이터가 없습니다.</td></tr>';
        } else {
            let i = (curPage - 1) * curSize;
            tbody.innerHTML = rows.map(d => `<tr>
                <td class="center"><input type="checkbox" class="ck" value="${d.id}"></td>
                <td class="center">${++i}</td>
                <td class="center">${formatStatus(d.status)}</td>
                <td>${escapeHtml(d.branchName)}</td>
                <td class="center"><a href="#" onclick="showHistory(${d.userId}, this.getAttribute('data-name')); return false;" data-name="${escapeHtml(d.userName)}" style="font-weight:bold; color:#0056b3;">${escapeHtml(d.userName)}</a></td>
                <td class="center">${escapeHtml(d.userId)}</td>
                <td class="center">${escapeHtml(d.applyDate)}</td>
                <td class="center">${escapeHtml(d.expectedStartDate)}</td>
                <td class="center">${escapeHtml(d.expectedReturnDate)}</td>
                <td class="center">${escapeHtml(d.receiptDate)}</td>
                <td class="center">${escapeHtml(d.wornStatus)}</td>
                <td class="center">${escapeHtml(d.deviceId)}</td>
                <td class="center">${escapeHtml(d.modelName)}</td>
                <td class="center">${escapeHtml(d.battery)}</td>
                <td class="center">${escapeHtml(d.returnDate)}</td>
            </tr>`).join('');
        }
        paginate(document.getElementById('paging'), res.pagination, 'loadRentals');
    }

    async function showHistory(userId, userName) {
        document.getElementById('historyDrawTitle').textContent = `${userName} > 임대이력`;
        const res = await api(`/api/rentals/users/${userId}?size=100`);
        const rows = res.data || [];

        const tbody = document.getElementById('historyBody');
        if (!rows.length) {
            tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:20px;color:#aaa">이력 없음</td></tr>';
        } else {
            let i = 0;
            tbody.innerHTML = rows.map(d => `<tr>
                <td class="center">${++i}</td>
                <td class="center">${formatStatus(d.status)}</td>
                <td class="center">${escapeHtml(d.branchName)}</td>
                <td class="center">${escapeHtml(d.expectedStartDate)}</td>
                <td class="center">${escapeHtml(d.expectedReturnDate)}</td>
                <td class="center">${escapeHtml(d.receiptDate)}</td>
                <td class="center">${escapeHtml(d.wornStatus)}</td>
                <td class="center">${escapeHtml(d.deviceId)}</td>
                <td class="center">${escapeHtml(d.modelName)}</td>
                <td class="center">${escapeHtml(d.returnDate)}</td>
            </tr>`).join('');
        }
        openDraw('historyDraw');
    }

    function toggleAll() { document.querySelectorAll('.ck').forEach(c => c.checked = document.getElementById('ckAll').checked); }
    function getChecked() { return [...document.querySelectorAll('.ck:checked')].map(c => Number(c.value)); }

    async function deleteSelected() {
        const ids = getChecked();
        if (!ids.length) { toast('삭제할 대상을 선택하세요', 'error'); return; }
        if (!confirm(`${ids.length}건을 삭제하시겠습니까?`)) return;
        for (const id of ids) await api(`/api/rentals/${id}`, 'DELETE');
        toast('삭제 완료'); loadRentals(curPage); loadBranches();
    }

    function saveAll() { toast('저장 로직은 백엔드 협의 후 연동예정입니다.'); }

    loadBranches();
    loadRentals(1);
</script>
</body>
</html>
