<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('AS 관리')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="page-wrapper">
    <div class="left-panel">
        <div class="left-panel-header">업체별 AS 현황</div>
        <div class="left-panel-list" id="vendorSummaryList">
        </div>
    </div>

    <div class="main-content">
        <div class="toolbar">
            <div class="toolbar-left">
                <div class="breadcrumb">
                    <span class="refresh" onclick="loadAsRecords(1)">⟳</span>
                    <span id="breadcrumb">전체 > AS 관리</span>
                </div>
            </div>
            <div class="toolbar-right">
                <button class="btn btn-delete" onclick="deleteSelected()">삭제</button>
                <button class="btn btn-new" onclick="openAsDraw()">신규 AS 접수</button>
            </div>
        </div>

        <div class="search-bar">
            <select id="sf">
                <option value="status">상태</option>
            </select>
            <input type="text" id="sk" placeholder="검색어 입력 후 엔터" onkeydown="if(event.key==='Enter')loadAsRecords(1)">
            <button class="search-btn" onclick="loadAsRecords(1)">🔍</button>
            <span class="total-info">총 <b id="totalEl">0</b>건</span>
            <span class="per-page">20 건씩 보기</span>
        </div>

        <div class="table-wrap">
            <table class="grid">
                <thead><tr>
                    <th style="width:30px"><input type="checkbox" id="ckAll" onchange="toggleAll()"></th>
                    <th>순번</th>
                    <th>상태</th>
                    <th>디바이스 ID</th>
                    <th>지점명</th>
                    <th>수리 업체</th>
                    <th>AS 유형</th>
                    <th>접수 일자</th>
                    <th>완료 일자</th>
                    <th>관리</th>
                </tr></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
        <div class="pagination-bar" id="paging"></div>
    </div>
</div>

<div class="draw-overlay" id="asDrawOverlay" onclick="closeDraw('asDraw')"></div>
<div class="draw" id="asDraw">
    <div class="draw-header">
        <span id="asDrawTitle">AS 접수/수정</span>
        <button class="draw-close" onclick="closeDraw('asDraw')">×</button>
    </div>
    <div class="draw-body">
        <input type="hidden" id="editAsId">

        <div id="newAsFields">
            <div class="form-group">
                <label>디바이스 ID (식별자) *</label>
                <input id="asDeviceId" type="number" placeholder="디바이스 PK 입력">
            </div>
        </div>

        <div class="form-group">
            <label>수리 업체</label>
            <select id="asVendor"></select>
        </div>

        <div class="form-group">
            <label>AS 유형</label>
            <select id="asType"></select>
        </div>

        <div id="editAsFields" style="display:none;">
            <div class="form-group">
                <label>진행 상태</label>
                <select id="asStatus">
                    <option value="AS_RECEIVED">접수됨 (AS_RECEIVED)</option>
                    <option value="AS_PROGRESS">진행중 (AS_PROGRESS)</option>
                </select>
            </div>

            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
            <div class="form-group">
                <label>수리 완료 일자</label>
                <input type="date" id="asCompleteDate">
                <small style="color: #666;">※ 완료일 입력 시 디바이스가 복구됩니다.</small>
            </div>
            <div class="form-group" style="display:flex; align-items:center; gap:8px;">
                <input type="checkbox" id="asIsDisposed" style="width:auto; margin:0;">
                <label for="asIsDisposed" style="margin:0; color:red;">수리 불가 (디바이스 폐기 처리)</label>
            </div>
        </div>

        <button class="btn btn-save" onclick="saveAsRecord()" style="margin-top:20px;width:100%">저장</button>
    </div>
</div>

<script th:src="@{/js/common.js}"></script>
<script>
    let curPage = 1;

    async function loadAsRecords(page) {
        curPage = page || 1;
        const p = new URLSearchParams({
            searchField: document.getElementById('sf').value,
            searchKeyword: document.getElementById('sk').value,
            page: String(curPage), size: "20"
        });

        if (document.getElementById('sf').value && document.getElementById('sk').value) {
            p.set('searchKeyword', document.getElementById('sk').value);
        }

        const res = await api('/api/as-records?' + p.toString());

        let total = res.pagination?.totalElements || 0;
        document.getElementById('totalEl').textContent = total;

        const tbody = document.getElementById('tbody');
        const rows = res.data || [];

        if (!rows.length) {
            tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:30px;color:#aaa">등록된 AS 기록이 없습니다.</td></tr>';
        } else {
            let i = (curPage - 1) * 20;
            tbody.innerHTML = rows.map(d => `<tr>
            <td class="center"><input type="checkbox" class="ck" value="${d.id}"></td>
            <td class="center">${++i}</td>
            <td class="center">${badge(d.status)}</td>
            <td class="center"><b>${d.device?.deviceId || '-'}</b></td>
            <td>${d.branch?.branchName || '-'}</td>
            <td>${d.vendor?.vendorName || '-'}</td>
            <td>${d.asType?.typeName || '-'}</td>
            <td class="center">${d.receiptDate || '-'}</td>
            <td class="center" style="color: ${d.completeDate ? 'blue' : 'inherit'}">${d.completeDate || '-'}</td>
            <td class="center">
                <button class="btn" style="padding: 2px 8px; font-size:12px;" onclick="openAsDraw(${d.id})">상세/수정</button>
            </td>
        </tr>`).join('');
        }
        paginate(document.getElementById('paging'), res.pagination, 'loadAsRecords');
    }

    async function loadVendorSummary() {
        const res = await api('/api/as-records/summary/by-vendor');
        const listEl = document.getElementById('vendorSummaryList');
        const summaries = res.data || [];

        listEl.innerHTML = summaries.map(s => `
        <div class="left-panel-item">
            <span>${s.vendorName}</span>
            <span class="count">${s.count}건</span>
        </div>
    `).join('') || '<div class="left-panel-item">데이터 없음</div>';
    }

    function toggleAll() { document.querySelectorAll('.ck').forEach(c => c.checked = document.getElementById('ckAll').checked); }
    function getChecked() { return [...document.querySelectorAll('.ck:checked')].map(c => Number(c.value)); }
    function badge(status) {
        if (status === 'AS_RECEIVED') return '<span style="color:orange; font-weight:bold;">접수됨</span>';
        if (status === 'AS_PROGRESS') return '<span style="color:blue; font-weight:bold;">진행중</span>';
        return `<span style="color:gray;">${status}</span>`;
    }

    // 폼 셀렉트 박스 사전 로드
    async function loadSelectOptions() {
        const vendorRes = await api('/api/vendors?size=100');
        const typeRes = await api('/api/as-types?size=100');

        const vSel = document.getElementById('asVendor');
        vSel.innerHTML = '<option value="">업체 선택 안함</option>' +
            (vendorRes.data || []).map(v => `<option value="${v.id}">${v.vendorName}</option>`).join('');

        const tSel = document.getElementById('asType');
        tSel.innerHTML = '<option value="">유형 선택 안함</option>' +
            (typeRes.data || []).map(t => `<option value="${t.id}">${t.typeName}</option>`).join('');
    }

    async function openAsDraw(id) {
        document.getElementById('editAsId').value = id || '';
        document.getElementById('asDrawTitle').textContent = id ? 'AS 상태 변경 및 완료' : '신규 AS 접수';

        const newFields = document.getElementById('newAsFields');
        const editFields = document.getElementById('editAsFields');

        document.getElementById('asVendor').value = '';
        document.getElementById('asType').value = '';

        if (id) {
            newFields.style.display = 'none';
            editFields.style.display = 'block';
            document.getElementById('asStatus').value = 'AS_RECEIVED';
            document.getElementById('asCompleteDate').value = '';
            document.getElementById('asIsDisposed').checked = false;
        } else {
            newFields.style.display = 'block';
            editFields.style.display = 'none';
            document.getElementById('asDeviceId').value = '';
        }

        openDraw('asDraw');
    }

    async function saveAsRecord() {
        const id = document.getElementById('editAsId').value;

        const baseBody = {};
        if(document.getElementById('asVendor').value) baseBody.vendorId = document.getElementById('asVendor').value;
        if(document.getElementById('asType').value) baseBody.asTypeId = document.getElementById('asType').value;

        if (id) {
            // 수정 (상태 변경 및 완료 처리)
            baseBody.status = document.getElementById('asStatus').value;
            const completeDate = document.getElementById('asCompleteDate').value;

            if (completeDate) {
                baseBody.completeDate = completeDate;
                baseBody.isDisposed = document.getElementById('asIsDisposed').checked;
            }

            const r = await api(`/api/as-records/${id}`, 'PATCH', baseBody);
            if (r.success) {
                toast('AS 수정 완료');
                closeDraw('asDraw');
                loadAsRecords(curPage);
            } else {
                toast(r.error?.message || '실패', 'error');
            }
        } else {
            // 신규 접수
            const deviceId = document.getElementById('asDeviceId').value;
            if(!deviceId) { toast('디바이스 ID를 입력하세요.', 'error'); return; }

            baseBody.deviceId = deviceId;

            const r = await api('/api/as-records', 'POST', baseBody);
            if (r.success) {
                toast('AS 접수 완료');
                closeDraw('asDraw');
                loadAsRecords(1);
                loadVendorSummary();
            } else {
                toast(r.error?.message || '실패', 'error');
            }
        }
    }

    async function deleteSelected() {
        const ids = getChecked();
        if (!ids.length) { toast('삭제할 기록을 선택하세요', 'error'); return; }
        if (!confirm(`선택한 ${ids.length}개 기록을 삭제하시겠습니까?`)) return;

        for (const id of ids) { await api(`/api/as-records/${id}`, 'DELETE'); }
        toast('삭제가 완료되었습니다.');
        loadAsRecords(curPage);
        loadVendorSummary();
    }

    // 초기화
    loadSelectOptions().then(() => {
        loadAsRecords(1);
        loadVendorSummary();
    });
</script>
</body>
</html>
