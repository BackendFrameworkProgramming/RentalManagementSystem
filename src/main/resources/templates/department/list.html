<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('부서/팀 관리')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="page-wrapper">
    <!-- 좌측 부서 패널 -->
    <div class="left-panel">
        <div class="left-panel-header">
            부서 <button class="btn btn-new" style="float:right;font-size:11px;padding:2px 6px" onclick="newDept()">+</button>
        </div>
        <div class="left-panel-list" id="deptList"></div>
    </div>
    <!-- 우측 팀 -->
    <div class="main-content">
        <div class="toolbar">
            <div class="toolbar-left">
                <div class="breadcrumb" id="breadcrumb">부서 선택</div>
            </div>
            <div class="toolbar-right">
                <button class="btn" onclick="showHistory('dept')">부서 이력</button>
                <button class="btn btn-new" onclick="newTeam()">팀 추가</button>
            </div>
        </div>
        <div class="table-wrap">
            <table class="grid">
                <thead><tr>
                    <th>순번</th><th>팀명</th><th>사용여부</th><th>적용일</th><th>정렬</th><th>관리</th>
                </tr></thead>
                <tbody id="teamTbody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- 부서 폼 -->
<div class="draw-overlay" id="deptDrawOverlay" onclick="closeDraw('deptDraw')"></div>
<div class="draw" id="deptDraw">
    <div class="draw-header"><span id="deptFormTitle">부서 등록</span><button class="draw-close" onclick="closeDraw('deptDraw')">×</button></div>
    <div class="draw-body">
        <input type="hidden" id="deptEditId">
        <div class="form-group"><label>부서명</label><input id="d_name"></div>
        <div class="form-group"><label>적용일</label><input id="d_applied" type="date"></div>
        <div class="form-group"><label>정렬순서</label><input id="d_sort" type="number"></div>
        <div class="form-group"><label>변경자</label><input id="d_changedBy" placeholder="본인 이름"></div>
        <button class="btn btn-save" onclick="saveDept()" style="margin-top:12px;width:100%">저장</button>
    </div>
</div>

<!-- 팀 폼 -->
<div class="draw-overlay" id="teamDrawOverlay" onclick="closeDraw('teamDraw')"></div>
<div class="draw" id="teamDraw">
    <div class="draw-header"><span id="teamFormTitle">팀 등록</span><button class="draw-close" onclick="closeDraw('teamDraw')">×</button></div>
    <div class="draw-body">
        <input type="hidden" id="teamEditId">
        <div class="form-group"><label>팀명</label><input id="t_name"></div>
        <div class="form-group"><label>적용일</label><input id="t_applied" type="date"></div>
        <div class="form-group"><label>정렬순서</label><input id="t_sort" type="number"></div>
        <div class="form-group"><label>변경자</label><input id="t_changedBy" placeholder="본인 이름"></div>
        <button class="btn btn-save" onclick="saveTeam()" style="margin-top:12px;width:100%">저장</button>
    </div>
</div>

<!-- 이력 Draw -->
<div class="draw-overlay" id="historyDrawOverlay" onclick="closeDraw('historyDraw')"></div>
<div class="draw" id="historyDraw">
    <div class="draw-header"><span id="historyTitle">변경 이력</span><button class="draw-close" onclick="closeDraw('historyDraw')">×</button></div>
    <div class="draw-body">
        <table class="grid"><thead><tr><th>변경구분</th><th>변경전</th><th>변경후</th><th>변경자</th><th>변경일</th></tr></thead>
        <tbody id="historyTbody"></tbody></table>
    </div>
</div>

<script th:src="@{/js/common.js}"></script>
<script>
let curDeptId = null, curDeptName = '';

async function loadDepts(){
    const res = await api('/api/departments?page=1&size=100');
    const data = res.data || [];
    let html = '';
    data.forEach(d => {
        html += `<div class="left-panel-item ${d.id===curDeptId?'active':''}" onclick="selectDept(${d.id},'${d.deptName}')">
            <span>${d.deptName}</span>
            <span>
                <button class="btn" style="font-size:10px;padding:0 4px" onclick="event.stopPropagation();editDept(${JSON.stringify(d).replace(/"/g,'&quot;')})">✎</button>
                <button class="btn btn-delete" style="font-size:10px;padding:0 4px" onclick="event.stopPropagation();deleteDept(${d.id})">×</button>
            </span>
        </div>`;
    });
    document.getElementById('deptList').innerHTML = html || '<div style="padding:8px;color:#999">부서 없음</div>';
}

async function selectDept(id, name){
    curDeptId = id; curDeptName = name;
    document.getElementById('breadcrumb').textContent = name + ' > 팀 목록';
    await loadDepts();
    await loadTeams();
}

async function loadTeams(){
    if(!curDeptId){ document.getElementById('teamTbody').innerHTML = '<tr><td colspan="6" style="text-align:center;padding:20px">부서를 선택하세요</td></tr>'; return; }
    const res = await api(`/api/departments/${curDeptId}/teams?page=1&size=50`);
    const data = res.data || [];
    let html = '';
    data.forEach((t, i) => {
        html += `<tr>
            <td>${i+1}</td>
            <td>${t.teamName||'-'}</td>
            <td>${t.useYn?'사용':'미사용'}</td>
            <td>${t.appliedDate||'-'}</td>
            <td>${t.sortOrder||'-'}</td>
            <td>
                <button class="btn" onclick='editTeam(${JSON.stringify(t)})'>수정</button>
                <button class="btn" onclick="showTeamHistory(${t.id})">이력</button>
                <button class="btn btn-delete" onclick="deleteTeam(${t.id})">삭제</button>
            </td>
        </tr>`;
    });
    document.getElementById('teamTbody').innerHTML = html || '<tr><td colspan="6" style="text-align:center;padding:20px">팀 없음</td></tr>';
}

// === 부서 ===
function newDept(){
    document.getElementById('deptEditId').value = '';
    document.getElementById('deptFormTitle').textContent = '부서 등록';
    ['d_name','d_applied','d_sort','d_changedBy'].forEach(id => document.getElementById(id).value = '');
    openDraw('deptDraw');
}
function editDept(d){
    document.getElementById('deptEditId').value = d.id;
    document.getElementById('deptFormTitle').textContent = '부서 수정';
    document.getElementById('d_name').value = d.deptName||'';
    document.getElementById('d_applied').value = d.appliedDate||'';
    document.getElementById('d_sort').value = d.sortOrder||'';
    openDraw('deptDraw');
}
async function saveDept(){
    const id = document.getElementById('deptEditId').value;
    const body = {
        deptName: document.getElementById('d_name').value,
        appliedDate: document.getElementById('d_applied').value || null,
        sortOrder: document.getElementById('d_sort').value ? Number(document.getElementById('d_sort').value) : null,
        changedBy: document.getElementById('d_changedBy').value || null
    };
    const res = id
        ? await api(`/api/departments/${id}`, 'PATCH', body)
        : await api('/api/departments', 'POST', body);
    if(res.success){ toast(id?'수정됨':'등록됨'); closeDraw('deptDraw'); loadDepts(); }
    else toast(res.error?.message||'실패','error');
}
async function deleteDept(id){
    if(!confirm('정말 삭제하시겠습니까?')) return;
    const res = await api(`/api/departments/${id}`, 'DELETE');
    if(res.success){ toast('삭제됨'); curDeptId = null; loadDepts(); loadTeams(); }
    else toast(res.error?.message||'실패','error');
}

// === 팀 ===
function newTeam(){
    if(!curDeptId){ toast('먼저 부서를 선택하세요','error'); return; }
    document.getElementById('teamEditId').value = '';
    document.getElementById('teamFormTitle').textContent = curDeptName + ' - 팀 등록';
    ['t_name','t_applied','t_sort','t_changedBy'].forEach(id => document.getElementById(id).value = '');
    openDraw('teamDraw');
}
function editTeam(t){
    document.getElementById('teamEditId').value = t.id;
    document.getElementById('teamFormTitle').textContent = '팀 수정';
    document.getElementById('t_name').value = t.teamName||'';
    document.getElementById('t_applied').value = t.appliedDate||'';
    document.getElementById('t_sort').value = t.sortOrder||'';
    openDraw('teamDraw');
}
async function saveTeam(){
    const id = document.getElementById('teamEditId').value;
    const body = {
        teamName: document.getElementById('t_name').value,
        departmentId: curDeptId,
        appliedDate: document.getElementById('t_applied').value || null,
        sortOrder: document.getElementById('t_sort').value ? Number(document.getElementById('t_sort').value) : null,
        changedBy: document.getElementById('t_changedBy').value || null
    };
    const res = id
        ? await api(`/api/teams/${id}`, 'PATCH', body)
        : await api('/api/teams', 'POST', body);
    if(res.success){ toast(id?'수정됨':'등록됨'); closeDraw('teamDraw'); loadTeams(); }
    else toast(res.error?.message||'실패','error');
}
async function deleteTeam(id){
    if(!confirm('정말 삭제하시겠습니까?')) return;
    const res = await api(`/api/teams/${id}`, 'DELETE');
    if(res.success){ toast('삭제됨'); loadTeams(); }
    else toast(res.error?.message||'실패','error');
}

// === 이력 ===
async function showHistory(kind){
    if(!curDeptId){ toast('부서를 먼저 선택하세요','error'); return; }
    document.getElementById('historyTitle').textContent = curDeptName + ' 변경 이력';
    const res = await api(`/api/departments/${curDeptId}/history?page=1&size=50`);
    renderHistory(res.data || []);
}
async function showTeamHistory(teamId){
    document.getElementById('historyTitle').textContent = '팀 변경 이력';
    const res = await api(`/api/teams/${teamId}/history?page=1&size=50`);
    renderHistory(res.data || []);
}
function renderHistory(rows){
    let html = '';
    rows.forEach(h => {
        html += `<tr>
            <td>${h.changeType||'-'}</td>
            <td style="font-size:11px;max-width:200px;word-break:break-all">${h.beforeValue||'-'}</td>
            <td style="font-size:11px;max-width:200px;word-break:break-all">${h.afterValue||'-'}</td>
            <td>${h.changedBy||'-'}</td>
            <td>${h.changedDate||'-'}</td>
        </tr>`;
    });
    document.getElementById('historyTbody').innerHTML = html || '<tr><td colspan="5" style="text-align:center">이력 없음</td></tr>';
    openDraw('historyDraw');
}

loadDepts();
</script>
</body>
</html>
