<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('설계 개선 이력')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="page-wrapper">
    <div class="main-content" style="overflow-y:auto;padding:20px 24px;background:#f5f6fa">
        <div class="toolbar" style="background:transparent;border:none;padding:0 0 12px">
            <div class="toolbar-left"><div class="breadcrumb">설계 개선 이력</div></div>
            <div class="toolbar-right"><button class="btn btn-new" onclick="openCreate()">+ 이력 추가</button></div>
        </div>
        <div class="dh-grid" id="cardGrid"></div>
    </div>
</div>

<!-- 상세 Draw -->
<div class="draw-overlay" id="detailDrawOverlay" onclick="closeDraw('detailDraw')"></div>
<div class="draw" id="detailDraw" style="width:620px">
    <div class="draw-header"><span id="detailDrawTitle">상세</span><button class="draw-close" onclick="closeDraw('detailDraw')">&times;</button></div>
    <div class="draw-body" id="detailBody"></div>
</div>

<!-- 등록/수정 Draw -->
<div class="draw-overlay" id="formDrawOverlay" onclick="closeDraw('formDraw')"></div>
<div class="draw" id="formDraw" style="width:580px">
    <div class="draw-header"><span id="formDrawTitle">이력 등록</span><button class="draw-close" onclick="closeDraw('formDraw')">&times;</button></div>
    <div class="draw-body">
        <input type="hidden" id="editId">
        <div class="form-section">
            <div class="form-row">
                <div class="form-group"><label>차수 *</label><input type="number" id="fRound" min="1"></div>
                <div class="form-group"><label>날짜 *</label><input id="fDate" placeholder="5/23"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>피드백 출처 *</label><input id="fSource" placeholder="교수님 피드백"></div>
                <div class="form-group"><label>출처 유형 *</label>
                    <select id="fType" style="width:100%;padding:7px 10px;border:1px solid #cbd5e0;border-radius:3px;font-size:12px">
                        <option value="prof">교수님</option><option value="ta">조교</option>
                        <option value="ai">AI</option><option value="self">자체</option>
                    </select>
                </div>
            </div>
            <div class="form-group"><label>제목 *</label><input id="fTitle" placeholder="변경 제목"></div>
        </div>
        <div class="form-section">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                <label style="font-weight:600;font-size:12px">변경사항</label>
                <button class="btn btn-sm btn-new" onclick="addChangeRow()">+ 추가</button>
            </div>
            <div id="changesArea"></div>
        </div>
        <div style="display:flex;gap:6px">
            <button class="btn btn-save" onclick="saveHistory()">저장</button>
            <button class="btn btn-delete" id="btnDel" style="display:none" onclick="deleteHistory()">삭제</button>
        </div>
    </div>
</div>

<script th:src="@{/js/common.js}"></script>
<script>
const TYPE_COLORS={prof:'#3498db',ta:'#2ecc71',ai:'#e67e22',self:'#e74c3c'};
const TYPE_LABELS={prof:'교수님',ta:'조교',ai:'AI',self:'자체'};
let allData=[];

async function load(){
    const r=await api('/api/design-history');allData=r.data||[];
    document.getElementById('cardGrid').innerHTML=allData.map(d=>{
        const changes=parseChanges(d.changes);
        const color=TYPE_COLORS[d.sourceType]||'#95a5a6';
        return `<div class="dh-card" onclick="showDetail(${d.id})" style="border-top:4px solid ${color}">
            <div class="dh-card-head">
                <span class="dh-round">${d.round}차</span>
                <span class="dh-date">${d.roundDate}</span>
                <span class="dh-tag" style="background:${color}20;color:${color}">${d.source}</span>
            </div>
            <div class="dh-card-title">${d.title}</div>
            <div class="dh-card-foot">${changes.length}건의 변경사항</div>
        </div>`;
    }).join('')||'<div style="padding:40px;text-align:center;color:#aaa">설계 이력이 없습니다.</div>';
}

function parseChanges(s){try{return JSON.parse(s||'[]');}catch(e){return [];}}

async function showDetail(id){
    const r=await api(`/api/design-history/${id}`);if(!r.success)return;
    const d=r.data,changes=parseChanges(d.changes),color=TYPE_COLORS[d.sourceType]||'#95a5a6';
    document.getElementById('detailDrawTitle').textContent=d.round+'차 — '+d.title;
    document.getElementById('detailBody').innerHTML=`
        <div class="detail-page-indicator" style="background:${color}">
            <div class="detail-page-name">${d.round}차 (${d.roundDate})</div>
            <div class="detail-page-sub">${d.source} — ${d.title}</div>
        </div>
        ${changes.map(c=>`<div class="tl-change" style="margin-bottom:10px">
            <div class="tl-label">${c.label||''}</div>
            ${c.before?`<div class="tl-before">${c.before}</div>`:''}
            ${c.after?`<div class="tl-after">${c.after}</div>`:''}
            ${c.reason?`<div class="tl-reason">${c.reason}</div>`:''}
        </div>`).join('')}
        <div style="margin-top:16px;display:flex;gap:6px">
            <button class="btn btn-save" onclick="closeDraw('detailDraw');openEdit(${d.id})">수정</button>
            <button class="btn btn-delete" onclick="deleteById(${d.id})">삭제</button>
        </div>`;
    openDraw('detailDraw');
}

function openCreate(){
    document.getElementById('editId').value='';
    document.getElementById('fRound').value=allData.length+1;
    document.getElementById('fDate').value='';document.getElementById('fSource').value='';
    document.getElementById('fType').value='prof';document.getElementById('fTitle').value='';
    document.getElementById('changesArea').innerHTML='';document.getElementById('btnDel').style.display='none';
    document.getElementById('formDrawTitle').textContent='이력 등록';
    addChangeRow();openDraw('formDraw');
}

async function openEdit(id){
    const r=await api(`/api/design-history/${id}`);if(!r.success)return;
    const d=r.data,changes=parseChanges(d.changes);
    document.getElementById('editId').value=d.id;
    document.getElementById('fRound').value=d.round;document.getElementById('fDate').value=d.roundDate;
    document.getElementById('fSource').value=d.source;document.getElementById('fType').value=d.sourceType;
    document.getElementById('fTitle').value=d.title;
    document.getElementById('btnDel').style.display='inline-block';
    document.getElementById('formDrawTitle').textContent='이력 수정';
    document.getElementById('changesArea').innerHTML='';
    changes.forEach(c=>addChangeRow(c));
    if(changes.length===0)addChangeRow();
    openDraw('formDraw');
}

function addChangeRow(c){
    const div=document.createElement('div');div.className='change-row';
    div.innerHTML=`<div class="form-group"><label>항목명</label><input class="cLabel" value="${c?.label||''}"></div>
        <div class="form-group"><label>변경 전</label><input class="cBefore" value="${c?.before||''}"></div>
        <div class="form-group"><label>변경 후</label><input class="cAfter" value="${c?.after||''}"></div>
        <div class="form-group"><label>사유</label><input class="cReason" value="${c?.reason||''}"></div>
        <button class="btn btn-sm btn-delete" onclick="this.parentElement.remove()" style="margin-top:4px">제거</button><hr style="border:none;border-top:1px solid #eee;margin:8px 0">`;
    document.getElementById('changesArea').appendChild(div);
}

async function saveHistory(){
    const id=document.getElementById('editId').value;
    const rows=document.querySelectorAll('.change-row');
    const changes=[...rows].map(r=>({label:r.querySelector('.cLabel').value,before:r.querySelector('.cBefore').value,
        after:r.querySelector('.cAfter').value,reason:r.querySelector('.cReason').value})).filter(c=>c.label);
    const body={round:Number(document.getElementById('fRound').value),roundDate:document.getElementById('fDate').value,
        source:document.getElementById('fSource').value,sourceType:document.getElementById('fType').value,
        title:document.getElementById('fTitle').value,changes:JSON.stringify(changes)};
    const r=id?await api(`/api/design-history/${id}`,'PATCH',body):await api('/api/design-history','POST',body);
    if(r.success){toast(id?'수정 완료':'등록 완료');closeDraw('formDraw');load();}else toast(r.error?.message,'error');
}

async function deleteHistory(){const id=document.getElementById('editId').value;await deleteById(id);}
async function deleteById(id){if(!confirm('삭제하시겠습니까?'))return;const r=await api(`/api/design-history/${id}`,'DELETE');if(r.success){toast('삭제 완료');closeDraw('detailDraw');closeDraw('formDraw');load();}else toast(r.error?.message,'error');}

load();
</script>
</body></html>
