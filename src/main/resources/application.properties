# Server
server.port=8083

spring.datasource.url=jdbc:mysql://101.79.16.88:3306/team3?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:team3}
# OWASP A02(암호화 실패): 시크릿은 환경변수로만 주입(평문 fallback 제거). DB_PASSWORD 미설정 시 기동 실패.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
# OWASP A05(보안 설정 오류): SQL/구조 노출 방지를 위해 운영 기본값은 off.
# 로컬 디버깅 시 환경변수 JPA_SHOW_SQL=true 로 켤 수 있다.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads

# Logging
# OWASP A05/A09: 운영에서는 SQL/상세 로그를 낮춰 내부 구조 노출을 막는다. (env로 조정 가능)
logging.level.org.hibernate.SQL=${LOG_SQL_LEVEL:WARN}
logging.level.hanyang.RentalManagementSystem=${LOG_APP_LEVEL:INFO}

# OWASP A05/A09(보안 설정·로깅): 기본 에러 응답에 스택트레이스/내부 메시지/예외클래스 노출 차단.
# 상세는 서버 로그/DB(system_error_log)에만 기록하고, 클라이언트엔 일반 메시지만 반환.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# JWT
# OWASP A02: JWT 시크릿은 JWT_SECRET 환경변수로만 주입(평문 fallback 제거). 미설정 시 기동 실패.
jwt.secret=${JWT_SECRET}
jwt.access-expiration=86400000
jwt.refresh-expiration=604800000

drvalue.broker-url=tcp://101.79.16.88:1883
drvalue.rest-api-url=http://101.79.16.88:3000
drvalue.tenant-id=tenant-3
drvalue.client-id=team3-${random.uuid}
drvalue.qos=1
drvalue.rest-timeout=10s
drvalue.auto-start=true