# Server
server.port=8083

spring.datasource.url=jdbc:mysql://101.79.16.88:3306/team3?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:team3}
# OWASP A02(암호화 실패): 시크릿은 환경변수로 외부화. 운영에서는 DB_PASSWORD 환경변수로 주입한다.
# (주의: 아래 기본값은 이미 git 히스토리에 노출됨 -> 근본 해결을 위해 DB 비밀번호 교체 권장)
spring.datasource.password=${DB_PASSWORD:zJzIz7ZANNuSjsjRjDxHbTPHg2RylNX8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
# OWASP A05(보안 설정 오류): SQL/구조 노출 방지를 위해 운영 기본값은 off.
# 로컬 디버깅 시 환경변수 JPA_SHOW_SQL=true 로 켤 수 있다.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads

# Logging
# OWASP A05/A09: 운영에서는 SQL/상세 로그를 낮춰 내부 구조 노출을 막는다. (env로 조정 가능)
logging.level.org.hibernate.SQL=${LOG_SQL_LEVEL:WARN}
logging.level.hanyang.RentalManagementSystem=${LOG_APP_LEVEL:INFO}

# JWT
# OWASP A02: JWT 시크릿도 운영에서는 JWT_SECRET 환경변수로 주입한다. (기본값은 노출됨 -> 교체 권장)
jwt.secret=${JWT_SECRET:rental-management-system-team3-very-secure-secret-key-2024-spring-boot}
jwt.access-expiration=86400000
jwt.refresh-expiration=604800000

drvalue.broker-url=tcp://101.79.16.88:1883
drvalue.rest-api-url=http://101.79.16.88:3000
drvalue.tenant-id=tenant-3
drvalue.client-id=team3-${random.uuid}
drvalue.qos=1
drvalue.rest-timeout=10s
drvalue.auto-start=true